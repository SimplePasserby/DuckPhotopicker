name: Build Duck PhotoPicker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-24 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

#      - name: Build debug APK
#        run: ./gradlew assembleDebug --stacktrace
#
#      - name: Upload APK artifact
#        uses: actions/upload-artifact@v5
#        with:
#          name: DuckPhotoPicker-debug
#          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode and setup keystore
        run: |
          printf "${{ secrets.DUCKSIGNINGKEY }}" > duck64 
          cat duck64 | base64 -d > duck.keystore
          echo ""
          cat duck64 
          echo ""
          echo "KEYSTORE_FILE=${{ github.workspace }}/duck.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=${{ secrets.DUCKKEYPASS }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=duck" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.DUCKKEYPASS }}" >> $GITHUB_ENV

      - name: Verify keystore
        run: |
          keytool -list -v -keystore duck.keystore -storepass ${{ secrets.DUCKKEYPASS }} 

      - name: Add signing config to gradle.properties
        run: |
          echo "RELEASE_STORE_FILE=${{ env.KEYSTORE_FILE }}" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.DUCKKEYPASS }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=duck" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.DUCKKEYPASS }}" >> gradle.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: DuckPhotoPicker-release
          path: app/build/outputs/apk/release/app-release.apk